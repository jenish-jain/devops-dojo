# Create RBAC resources here (ServiceAccount, Role, RoleBinding)
# You can include multiple resources in one file using ---
# Example:
# ---
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: my-service-account
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: pod-reader
# rules:
# - apiGroups: [""]
#   resources: ["pods"]
#   verbs: ["get", "list"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: read-pods
# subjects:
# - kind: ServiceAccount
#   name: my-service-account
# roleRef:
#   kind: Role
#   name: pod-reader
#   apiGroup: rbac.authorization.k8s.io
