# This service can't reach its pods! Can you fix it?
# Hint: The selector doesn't match the pod labels
---
apiVersion: v1
kind: Pod
metadata:
  name: web-app
  labels:
    app: webapp
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web-app  # This doesn't match the pod label "webapp"!
    # Fix: Change to match the pod labels:
    # app: webapp
    # tier: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
