[[exercises]]
name = "deploy_deployment"
path = "exercises/03_deploy_deployment/main.go"
mode = "compile"
hint = """
Create a deployment.yaml file with:
- kind: Deployment
- replicas: 3
- selector with matchLabels
- template with pod specification

Make sure the selector labels match the pod template labels!
"""

[[exercises]]
name = "create_configmap"
path = "exercises/04_create_configmap/main.go"
mode = "compile"
hint = """
Create a configmap.yaml file with:
- kind: ConfigMap
- data: section with key-value pairs

ConfigMaps store non-sensitive configuration data.
Example keys: DATABASE_URL, LOG_LEVEL, etc.
"""

[[exercises]]
name = "create_secret"
path = "exercises/05_create_secret/main.go"
mode = "compile"
hint = """
Create a secret.yaml file with:
- kind: Secret
- type: Opaque
- data: base64-encoded values

To encode: echo -n 'mypassword' | base64
Remember: Secrets are for sensitive data like passwords and API keys!
"""